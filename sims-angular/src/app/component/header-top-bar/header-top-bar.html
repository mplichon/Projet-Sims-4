<header>
  <div class="logo-title">
    <div class="logo-container">
      <img src="images/logo-sims-4-encyclopedie-couleur.png" />
    </div>
    <h1>
      <a routerLink="/"> Sims 4 Encyclopédie </a>
    </h1>
  </div>
  <nav>
    <a routerLink="/gestion/dlc">DLCs</a>
    <a routerLink="/gestion/competence">Compétences</a>
    <a routerLink="/gestion/carriere">Carrières</a>
    <a routerLink="/gestion/aspiration">Aspirations</a>
    <a routerLink="/gestion/trait">Traits</a>
    <span (click)="userPopover.toggle($event)">
      <p-avatar icon="pi pi-user" shape="circle" class="login-btn cursor-pointer" />
      <p-popover #userPopover>
        @if (currentUser.hasValue()) {
          <div class="text-sm font-semibold">
            {{ username() }}
          </div>
          <p-divider />
          <span (click)="logout()" class="text-sm cursor-pointer" routerLink="/login">
            Déconnexion
          </span>
        } @else {
          <a class="text-sm" routerLink="/login">Connexion</a>
        }
      </p-popover>
    </span>
  </nav>
</header>
