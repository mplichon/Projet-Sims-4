</section>

      [title]="competence.title"
      [content]="competence.content"
      [link]="competence.link"
    />

      [title]="carriere.title"
      [content]="carriere.content"
      [link]="carriere.link"
    />
    <sims-section-du-site-card
      [title]="aspiration.title"
      [content]="aspiration.content"
      [link]="aspiration.link"
    />
    <sims-section-du-site-card
      [title]="trait.title"

      [link]="trait.link"
    />
