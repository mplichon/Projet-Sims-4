<p-table
  #dt
  [value]="traits()"
  [rows]="10"
  [columns]="cols"
  [paginator]="true"
  [globalFilterFields]="['nom']"
  [(selection)]="selectedTraits"
  [rowHover]="true"
  dataKey="id"
  currentPageReportTemplate="{first} à {last} sur {totalRecords} traits de caractère"
  [showCurrentPageReport]="true"
  [pt]="tablePt"
>
  <ng-template #caption>
    <div class="flex flex-row-reverse">
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="text"
          (input)="dt.filterGlobal($event.target.value, 'contains')"
          placeholder="Recherche..."
        />
      </p-iconfield>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <!-- Checkbox -->
      <th class="w-12 bg-primary-green rounded-tl-xl">
        <p-tableHeaderCheckbox />
      </th>
      <!-- Logo -->
      <th class="w-12 bg-primary-green text-white">Logo</th>
      <!-- Nom -->
      <th class="sort-icon-green-hover w-20 bg-primary-green text-white" pSortableColumn="nom">
        <div class="flex items-center gap-2">
          Nom
          <p-sortIcon field="nom" />
        </div>
      </th>
      <!-- Description -->
      <th class="bg-primary-green text-white w-auto">Description</th>
      <!-- Type -->
      <th class="sort-icon-green-hover w-40 bg-primary-green text-white" pSortableColumn="type.nom">
        <div class="flex items-center gap-2">
          Type
          <p-sortIcon field="type.nom" />
        </div>
      </th>
      <!-- Catégorie -->
      <th
        class="sort-icon-green-hover w-20 bg-primary-green text-white"
        pSortableColumn="categorie.nom"
      >
        <div class="flex items-center gap-2">
          Catégorie
          <p-sortIcon field="type.nom" />
        </div>
      </th>
      <!-- DLC -->
      <th class="w-12 bg-primary-green text-white">DLC</th>
      <!-- Boutons -->
      <th class="w-32 bg-primary-green rounded-tr-xl"></th>
    </tr>
  </ng-template>
  <ng-template #body let-trait>
    <tr>
      <!-- Checkbox -->
      <td>
        <p-tableCheckbox [value]="trait" />
      </td>
      <!-- Logo -->
      <td>
        <img [alt]="'Logo ' + trait.nom" [src]="trait.img" class="w-16" />
      </td>
      <!-- Nom -->
      <td>{{ trait.nom }}</td>
      <!-- Description -->
      <td>
        <div class="overflow-hidden h-16">{{ trait.description }}</div>
      </td>
      <!-- Type -->
      <td>{{ trait.type.nom }}</td>
      <!-- Catégorie -->
      <td>{{ trait.categorieSim.nom }}</td>
      <!-- DLC -->
      <td>
        <img
          [alt]="'Logo ' + trait.dlc.nom"
          [src]="trait.dlc.img"
          [title]="trait.dlc.nom"
          class="w-16"
        />
      </td>
      <!-- Boutons -->
      <td>
        <div class="flex gap-2">
          <p-button (onClick)="modifierTrait(trait)" [rounded]="true" icon="pi pi-pencil" />
          <p-button
            (onClick)="supprimerTrait(trait)"
            [rounded]="true"
            icon="pi pi-trash"
            severity="danger"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
