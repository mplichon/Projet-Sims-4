<sims-section>
  <sims-titre-section [titre]="sectionTitle()" />

  <div class="flex flex-col gap-6">
    <sims-gestion-toolbar
      (exportCsv)="exportTraitsCsv()"
      (ouvrirNouveauPopUp)="ouvrirPopUpNouveauTrait()"
      (supprimerSelection)="ouvrirPopUpSuppressionTraitsSelectionnes()"
      [isSupprimerButtonDisabled]="isToolbarSupprimerButtonDisabled()"
    />

    @if (traits.hasValue()) {
      <sims-trait-gestion-tableau
        (traitToUpdate)="ouvrirPopUpModifierTrait($event)"
        (traitToDelete)="ouvrirPopUpSuppressionTrait($event)"
        [(selectedTraits)]="selectedTraits"
        [traits]="traits.value()"
      />
    } @else {
      <div class="flex flex-col gap-3">
        <div class="flex flex-row-reverse">
          <p-skeleton height="3rem" width="16rem" />
        </div>
        <div class="flex flex-col gap-1">
          <p-skeleton height="3rem" />

          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
        </div>
      </div>
    }
  </div>
</sims-section>
