<sims-section>
  <sims-titre-section [titre]="sectionTitle()" />

  <div class="flex flex-col gap-6">
    <sims-gestion-toolbar
      (exportCsv)="exportCompetencesCsv()"
      (ouvrirNouveauPopUp)="ouvrirPopUpNouveauCompetence()"
      (supprimerSelection)="ouvrirPopUpSuppressionCompetencesSelectionnes()"
      [isSupprimerButtonDisabled]="isToolbarSupprimerButtonDisabled()"
    />

    @if (competences.hasValue()) {
      <sims-competence-gestion-tableau
        (competenceToUpdate)="ouvrirPopUpModifierCompetence($event)"
        (competenceToDelete)="ouvrirPopUpSuppressionCompetence($event)"
        [(selectedCompetences)]="selectedCompetences"
        [competences]="competences.value()"
      />
    }
  </div>
</sims-section>
