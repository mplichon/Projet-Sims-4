<div class="flex flex-col gap-6">
  <div class="flex items-center self-center gap-2">
    <span class="pi pi-exclamation-triangle" style="color: crimson; font-size: 2rem"></span>
    <span>Êtes-vous sûr de vouloir supprimer les DLCs sélectionnés ?</span>
  </div>

  <div class="flex justify-between gap-2">
    <p-button
      (click)="onCancel()"
      icon="pi pi-times"
      label="Non"
      severity="secondary"
      variant="text"
    />
    <p-button (click)="onSubmit()" [loading]="isLoading()" label="Oui" severity="danger" />
  </div>
</div>
