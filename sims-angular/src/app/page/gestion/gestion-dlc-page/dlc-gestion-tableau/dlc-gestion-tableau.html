<p-table
  #dt
  [value]="dlcs()"
  [rows]="10"
  [columns]="cols"
  [paginator]="true"
  [globalFilterFields]="['nom']"
  [(selection)]="selectedDlcs"
  [rowHover]="true"
  dataKey="id"
  currentPageReportTemplate="{first} à {last} sur {totalRecords} DLCs"
  [showCurrentPageReport]="true"
  [pt]="tablePt"
>
  <ng-template #caption>
    <div class="flex flex-row-reverse">
      <p-iconfield>
        <p-inputicon class="pi pi-search" />
        <input
          pInputText
          type="text"
          (input)="dt.filterGlobal($event.target.value, 'contains')"
          placeholder="Recherche..."
        />
      </p-iconfield>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <!-- Checkbox -->
      <th class="w-12 bg-primary-green rounded-tl-xl">
        <p-tableHeaderCheckbox />
      </th>
      <!-- Logo -->
      <th class="w-12 bg-primary-green text-white">Logo</th>
      <!-- Nom -->
      <th class="sort-icon-green-hover w-20 bg-primary-green text-white" pSortableColumn="nom">
        <div class="flex items-center gap-2">
          Nom
          <p-sortIcon field="nom" />
        </div>
      </th>
      <!-- Date de sortie -->
      <th
        class="sort-icon-green-hover w-20 bg-primary-green text-white"
        pSortableColumn="dateSortie"
      >
        <div class="flex items-center gap-2">
          Sortie
          <p-sortIcon field="dateSortie" />
        </div>
      </th>
      <!-- Description -->
      <th class="bg-primary-green text-white w-auto">Description</th>
      <!-- Type -->
      <th class="sort-icon-green-hover w-20 bg-primary-green text-white" pSortableColumn="type.nom">
        <div class="flex items-center gap-2">
          Type
          <p-sortIcon field="type.nom" />
        </div>
      </th>
      <!-- Boutons -->
      <th class="w-32 bg-primary-green rounded-tr-xl"></th>
    </tr>
  </ng-template>
  <ng-template #body let-dlc>
    <tr>
      <!-- Checkbox -->
      <td>
        <p-tableCheckbox [value]="dlc" />
      </td>
      <!-- Logo -->
      <td>
        <img [src]="dlc.img" [alt]="'Logo ' + dlc.nom" class="w-16" />
      </td>
      <!-- Nom -->
      <td>{{ dlc.nom }}</td>
      <!-- Date de sortie -->
      <td>{{ dlc.dateSortie | date: 'dd/MM/yyyy' }}</td>
      <!-- Description -->
      <td>
        <div class="overflow-hidden h-16">{{ dlc.description }}</div>
      </td>
      <!-- Type -->
      <td>
        <p-tag
          class="text-center"
          [value]="dlc.type.nom"
          [style]="{ backgroundColor: dlc.type.couleur }"
        />
      </td>
      <!-- Boutons -->
      <td>
        <div class="flex gap-2">
          <p-button icon="pi pi-pencil" [rounded]="true" (click)="modifierDlc(dlc)" />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [rounded]="true"
            (click)="supprimerDlc(dlc)"
          />
        </div>
      </td>
    </tr>
  </ng-template>
</p-table>
