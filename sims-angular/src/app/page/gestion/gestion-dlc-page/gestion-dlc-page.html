<sims-section>
  <sims-titre-section [titre]="sectionTitle()" />
  <p-toast />

  @if (dlcs.hasValue()) {
    <sims-dlc-gestion-toolbar
      (exportDlcsCsv)="exportDlcsCsv()"
      (ouvrirNouveauDlcPopUp)="ouvrirPopUpNouveauDlc()"
      (supprimerDlcsSelectionnes)="ouvrirPopUpSuppressionDlcsSelectionnes()"
      [isSupprimerButtonDisabled]="isToolbarSupprimerButtonDisabled()"
    />

    <sims-dlc-gestion-tableau
      (dlcToUpdate)="ouvrirPopUpModifierDlc($event)"
      (dlcToDelete)="ouvrirPopUpSuppressionDlc($event)"
      [(selectedDlcs)]="selectedDlcsV2"
      [dlcs]="dlcs.value()"
    />
  }
</sims-section>
