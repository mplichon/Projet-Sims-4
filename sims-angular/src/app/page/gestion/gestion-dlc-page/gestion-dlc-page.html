<sims-section>
  <sims-titre-section [titre]="gestionDlc" />
  <p-toast />

  <p-toolbar class="mb-6">
    <ng-template #start>
      <p-button label="Nouveau" class="mr-2" icon="pi pi-plus" (onClick)="ouvrirNouveau()" />
      <p-button
        severity="danger"
        label="Supprimer"
        icon="pi pi-trash"
        (onClick)="supprimerDlcsSelectionnes()"
        [disabled]="!selectedDlcs || !selectedDlcs.length"
      />
    </ng-template>
    <ng-template #end>
      <p-button label="Export" icon="pi pi-upload" severity="secondary" (onClick)="exportCSV()" />
    </ng-template>
  </p-toolbar>

  <p-table
    #dt
    [value]="dlcs"
    [rows]="10"
    [columns]="cols"
    [paginator]="true"
    [globalFilterFields]="['nom']"
    [(selection)]="selectedDlcs"
    [rowHover]="true"
    dataKey="id"
    currentPageReportTemplate="{first} à {last} sur {totalRecords} DLCs"
    [showCurrentPageReport]="true"
    [pt]="tablePt"
  >
    <ng-template #caption>
      <div class="flex flex-row-reverse">
        <p-iconfield>
          <p-inputicon class="pi pi-search" />
          <input
            pInputText
            type="text"
            (input)="dt.filterGlobal($event.target.value, 'contains')"
            placeholder="Recherche..."
          />
        </p-iconfield>
      </div>
    </ng-template>
    <ng-template #header>
      <tr>
        <th
          style="
            width: 3rem;
            background-color: var(--p-primary-color);
            border-top-left-radius: 10px;
          "
        >
          <p-tableHeaderCheckbox />
        </th>
        <th style="width: 3rem; background-color: var(--p-primary-color); color: white">Logo</th>
        <th
          class="dlc-colonne-nom"
          pSortableColumn="nom"
          style="width: 5rem; background-color: var(--p-primary-color); color: white"
        >
          <div class="flex items-center gap-2">
            Nom
            <p-sortIcon field="nom" />
          </div>
        </th>
        <th
          class="dlc-colonne-sortie"
          pSortableColumn="dateSortie"
          style="width: 5rem; background-color: var(--p-primary-color); color: white"
        >
          <div class="flex items-center gap-2">
            Sortie
            <p-sortIcon field="dateSortie" />
          </div>
        </th>
        <th style="width: 27rem; background-color: var(--p-primary-color); color: white">
          Description
        </th>
        <th
          class="dlc-colonne-type"
          pSortableColumn="type.nom"
          style="width: 5rem; background-color: var(--p-primary-color); color: white"
        >
          <div class="flex items-center gap-2">
            Type
            <p-sortIcon field="type.nom" />
          </div>
        </th>
        <th
          style="
            width: 8rem;
            background-color: var(--p-primary-color);
            border-top-right-radius: 10px;
          "
        ></th>
      </tr>
    </ng-template>
    <ng-template #body let-dlc>
      <tr>
        <td>
          <p-tableCheckbox [value]="dlc" />
        </td>
        <td>
          <img [src]="dlc.img" [alt]="'Logo ' + dlc.nom" style="width: 64px" />
        </td>
        <td>{{ dlc.nom }}</td>
        <td>{{ dlc.dateSortie | date: 'dd/MM/yyyy' }}</td>
        <td>
          <div class="overflow-hidden h-16">{{ dlc.description }}</div>
        </td>
        <td>
          <p-tag
            class="text-center"
            [value]="dlc.type.nom"
            [style]="{ backgroundColor: dlc.type.couleur }"
          />
        </td>
        <td style="width: 8rem">
          <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" (click)="modifierDlc(dlc)" />
          <p-button
            icon="pi pi-trash"
            severity="danger"
            [rounded]="true"
            (click)="supprimerDlc(dlc)"
          />
        </td>
      </tr>
    </ng-template>
  </p-table>
</sims-section>

<p-dialog
  [(visible)]="dlcDialog"
  [style]="{ width: '450px' }"
  [header]="dlcDialogTitle"
  [modal]="true"
>
  <ng-template #content>
    <div class="flex flex-col gap-6">
      <img
        [src]="dlc.img"
        [alt]="'Logo ' + dlc.nom"
        *ngIf="dlc.img"
        class="block m-auto pb-4"
        style="width: 100px"
      />
      <div>
        <label for="nom">Nom</label>
        <input type="text" pInputText id="nom" [(ngModel)]="dlc.nom" required autofocus fluid />
        <small *ngIf="submitted && !dlc.nom">Le nom est requis.</small>
      </div>
      <div>
        <label for="date-sortie">Date de sortie</label>
        <p-datepicker
          [(ngModel)]="dlc.dateSortie"
          [iconDisplay]="'input'"
          [showIcon]="true"
          inputId="date-sortie"
          dateFormat="dd/mm/yy"
          [pt]="datepickerPt"
          appendTo="body"
          required
          fluid
        />
        <small *ngIf="submitted && !dlc.dateSortie">La date est requise.</small>
      </div>
      <div>
        <label for="description">Description</label>
        <textarea
          id="description"
          pTextarea
          [(ngModel)]="dlc.description"
          required
          rows="3"
          cols="20"
          fluid
        ></textarea>
        <small *ngIf="submitted && !dlc.description">La description est requise.</small>
      </div>
      <div>
        <label for="img">Logo</label>
        <input type="text" pInputText id="img" [(ngModel)]="dlc.img" fluid />
      </div>

      <div>
        <label for="type" class="block font-bold mb-3">Type de DLC</label>
        <p-select
          [(ngModel)]="dlc.type"
          inputId="type"
          [options]="types"
          optionLabel="nom"
          placeholder="Sélectionne un type"
          appendTo="body"
          required
          fluid
        />
      </div>
    </div>
  </ng-template>

  <ng-template #footer>
    <p-button label="Annuler" icon="pi pi-times" text (click)="cacherDialog()" />
    <p-button label="Enregistrer" icon="pi pi-check" (click)="enregistrerDlc()" />
  </ng-template>
</p-dialog>

<p-confirmDialog />
