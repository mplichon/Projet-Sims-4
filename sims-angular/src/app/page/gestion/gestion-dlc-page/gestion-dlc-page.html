<sims-section>
  <sims-titre-section [titre]="sectionTitle()" />

  <div class="flex flex-col gap-6">
    <sims-gestion-toolbar
      (exportCsv)="exportDlcsCsv()"
      (ouvrirNouveauPopUp)="ouvrirPopUpNouveauDlc()"
      (supprimerSelection)="ouvrirPopUpSuppressionDlcsSelectionnes()"
      [isSupprimerButtonDisabled]="isToolbarSupprimerButtonDisabled()"
    />

    @if (dlcs.hasValue()) {
      <sims-dlc-gestion-tableau
        (dlcToUpdate)="ouvrirPopUpModifierDlc($event)"
        (dlcToDelete)="ouvrirPopUpSuppressionDlc($event)"
        [(selectedDlcs)]="selectedDlcs"
        [dlcs]="dlcs.value()"
      />
    }
  </div>
</sims-section>
