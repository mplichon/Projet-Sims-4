<sims-section>
  <sims-titre-section [titre]="sectionTitle()" />

  <div class="flex flex-col gap-6">
    <sims-gestion-toolbar
      (exportCsv)="exportDlcsCsv()"
      (ouvrirNouveauPopUp)="ouvrirPopUpNouveauCarriere()"
      (supprimerSelection)="ouvrirPopUpSuppressionCarrieresSelectionnes()"
      [isSupprimerButtonDisabled]="isToolbarSupprimerButtonDisabled()"
    />

    @if (carrieresV2.hasValue()) {
      <sims-carriere-gestion-tableau
        (carriereToUpdate)="ouvrirPopUpModifierCarriere($event)"
        (carriereToDelete)="ouvrirPopUpSuppressionCarriere($event)"
        [(selectedCarrieres)]="selectedCarrieresV2"
        [carrieres]="carrieresV2.value()"
      />
    } @else {
      <div class="flex flex-col gap-3">
        <div class="flex flex-row-reverse">
          <p-skeleton height="3rem" width="16rem" />
        </div>
        <div class="flex flex-col gap-1">
          <p-skeleton height="3rem" />

          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
          <p-skeleton height="5rem" />
        </div>
      </div>
    }
  </div>
</sims-section>
