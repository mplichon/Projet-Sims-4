<div class="flex flex-col gap-6">
  <div class="flex items-center self-center gap-2">
    <span class="pi pi-exclamation-triangle" style="color: crimson; font-size: 2rem"></span>
    <span
      >Êtes-vous sûr de vouloir supprimer la carrière
      <span class="font-medium italic">{{ carriere().nom }}</span> ?</span
    >
  </div>

  <div class="flex justify-between gap-2">
    <p-button
      (onClick)="onCancel()"
      icon="pi pi-times"
      label="Non"
      severity="secondary"
      variant="text"
    />
    <p-button (onClick)="onSubmit()" [loading]="isLoading()" label="Oui" severity="danger" />
  </div>
</div>
